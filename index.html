<!DOCTYPE html>
<html class="no-js" lang="">
  <head>
    <title>we can clap</title>
    <meta charset="utf-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      html,
      body {
        margin: 0;
        font-size: 40px;
      }
      main {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
      }
      #clapButton {
        background: #5bb65b;
        color: white;
        padding: 0.25rem 0.5rem;
        border: none;
        font-size: 1rem;
        border-radius: 0.1rem;
      }
      #clapButton:active {
        background-color: #499249;
      }
      #clapZone {
        z-index: -1;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }
      .clap {
        position: absolute;
        -webkit-animation: fadeOut 2s ease-in-out;
        animation: fadeOut 2s ease-in-out;
        animation-fill-mode: forwards;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.5em;
        height: 1.5em;
      }
      .clap.mine {
        background: rgba(91, 182, 91, 0.3);
      }
      @keyframes fadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #clappersCount {
        font: 16px monospace;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      window.onload = () => {
        const socket = io();
        const CLAP_DURATION = 2 * 1000; // matches css keyframes
        let index = Math.floor(Math.random() * 10);

        function getRandomArbitrary(min, max) {
          return Math.random() * (max - min) + min;
        }

        // emit clap
        document.querySelector("#clapButton").addEventListener("click", e => {
          e.preventDefault();
          socket.emit("clap");
        });

        // AUTO-CLICKER FOR TESTING
        // setInterval(() => {
        //   clapButton.click();
        // }, getRandomArbitrary(300, 700));

        // respond to claps
        socket.on("clap", displayClap);
        function displayClap(clap) {
          const { ts, socketId } = clap;
          const clapEl = document.createElement("div");
          const clapZoneEl = document.getElementById("clapZone");
          const clapContent = document.createTextNode("👏");

          // apply classes
          clapEl.classList.add("clap");
          console.log(socketId, socket.id);
          if (socketId === socket.id) {
            clapEl.classList.add("mine");
          }

          // random placement
          // using 95 cause position is top left corner and i don't want
          // any of these good, good claps to be hidden 🤷‍♀️
          clapEl.style.left = Math.random() * 95 + "vw";
          clapEl.style.top = Math.random() * 95 + "vh";

          // add to DOM
          clapEl.appendChild(clapContent);
          clapZoneEl.appendChild(clapEl);

          playClapSound(socketId);

          // remove from DOM
          setTimeout(() => {
            clapEl.remove();
          }, CLAP_DURATION);
        }

        function playClapSound(socketId) {
          const clapFiles = [
            "clap1.mp3",
            "clap2.mp3",
            "clap3.mp3",
            "clap4.mp3",
            "clap5.wav",
            "clap10.mp3",
            "clap11.mp3",
            "clap12.mp3",
            "clap13.mp3",
            "clap14.mp3",
            "clap15.mp3",
            "clap16.mp3",
            "clap17.mp3",
            "clap18.mp3",
            "clap19.mp3",
            "clap20.mp3",
            "clap21.mp3",
            "clap22.mp3",
          ];
          // const randomIndex = Math.floor(Math.random() * clapFiles.length);
          // const randomClapFile = clapFiles[randomIndex];

          index += 1;
          uniqueIndex = (index + socketId.charCodeAt(0)) % clapFiles.length;
          console.log(index, uniqueIndex, socketId.charCodeAt(0));
          const randomClapFile = clapFiles[uniqueIndex];
          var audio = new Audio(randomClapFile);
          audio.play();
          audio.remove();
        }

        // respond to client count
        const clappersCountEl = document.getElementById("clappersCount");
        socket.on("clientsCount", count => {
          clappersCountEl.innerHTML = `${count} Clappers`;
        });
      };
    </script>
  </head>
  <body>
    <main>
      <div id="clapZone"></div>
      <button id="clapButton">CLAP!</button>
      <div id="clappersCount">0 Clappers</div>
      <!-- <audio controls>
        <source src="clap1.mp3" type="audio/mpeg" />
      </audio> -->
    </main>
  </body>
</html>
