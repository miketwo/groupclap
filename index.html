<!DOCTYPE html>
<html class="no-js" lang="">
  <head>
    <title>we can clap</title>
    <meta charset="utf-8" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      html,

      body {
        margin: 0;
        font-size: 40px;
      }
      main {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
      }

      #clapContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      #clapButton {
        background: #5bb65b;
        color: white;
        padding: 0.25rem 0.5rem;
        border: none;
        font-size: 1rem;
        border-radius: 0.1rem;
      }
      #clapButton:active {
        background-color: #499249;
      }
      #clapZone {
        z-index: -1;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }
      .clap {
        position: absolute;
        -webkit-animation: fadeOut 2s ease-in-out;
        animation: fadeOut 2s ease-in-out;
        animation-fill-mode: forwards;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.5em;
        height: 1.5em;
      }
      .clap.mine {
        background: rgba(91, 182, 91, 0.3);
      }
      @keyframes fadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #clappersCount {
        font: 16px monospace;
        position: absolute;
        top: 0;
        left: 0;
      }
      #applauseGauge {
        width: 80%;
        height: 30px;
        background-color: #f0f0f0;
        border-radius: 15px;
        overflow: hidden;
        position: relative;
        margin-bottom: 20px;
      }

      #gaugeBar {
        width: 0;
        height: 100%;
        background-color: #5bb65b;
        transition: width 0.5s ease-in-out;
      }

      #gaugeLabels {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 0 10px;
        font-size: 14px;
        color: #333;
      }
    </style>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      window.onload = () => {
        const socket = io();
        const CLAP_DURATION = 2 * 1000; // matches css keyframes
        let index = Math.floor(Math.random() * 10);
        let clapTimestamps = [];

        const clapFrequencyUpdater = setInterval(() => {
          if (clapTimestamps.length > 1) {
              const freq = getFrequency();
              console.log("Frequency: ", freq, "clapTimestamps size: ", clapTimestamps.length)
              updateApplauseGauge(freq);
            }
        }, 1000);

        const getFrequency = () => {
          // filter claps that are older than 10 seconds
          const SECONDS_TO_KEEP = 5;
          const now = new Date().getTime();
          const xSecondsAgo = now - (SECONDS_TO_KEEP*1000);
          clapTimestamps = clapTimestamps.filter(ts => ts > xSecondsAgo);

          // calculate frequency
          const frequency = clapTimestamps.length / SECONDS_TO_KEEP;
          return frequency;
        }

        function getRandomArbitrary(min, max) {
          return Math.random() * (max - min) + min;
        }

        function isNumber(n) {
          return !isNaN(parseFloat(n)) && isFinite(n);
        }

        function updateApplauseGauge(frequency) {
          const gaugeBar = document.getElementById('gaugeBar');
          let gaugeLevel = 0;
          if (!isNumber(frequency)) {
            return;
          }

          const DIFFICULTY_FACTOR = 1.1;
          frequency = frequency / DIFFICULTY_FACTOR;
          console.log("Scaled: ", frequency);
          if (frequency >= 0 && frequency < 1) {
            gaugeLevel = 0;
          } else if (frequency >= 1 && frequency < 2) {
            gaugeLevel = 10;
          } else if (frequency >= 2 && frequency < 3) {
            gaugeLevel = 25;
          } else if (frequency >= 3 && frequency < 4) {
            gaugeLevel = 43;
          } else if (frequency >= 4 && frequency < 6) {
            gaugeLevel = 60;
          } else if (frequency >= 6 && frequency < 8) {
            gaugeLevel = 78;
          } else {
            gaugeLevel = 100;
          }

          gaugeBar.style.width = `${gaugeLevel}%`;
        }

        // emit clap
        document.querySelector("#clapButton").addEventListener("click", e => {
          e.preventDefault();
          socket.emit("clap");
        });

        // AUTO-CLICKER FOR TESTING
        // setInterval(() => {
        //   clapButton.click();
        // }, 300);

        // respond to claps
        socket.on("clap", displayClap);
        function displayClap(clap) {
          const { ts, socketId } = clap;
          const clapEl = document.createElement("div");
          const clapZoneEl = document.getElementById("clapZone");
          const clapContent = document.createTextNode("👏");

          // apply classes
          clapEl.classList.add("clap");
          if (socketId === socket.id) {
            clapEl.classList.add("mine");
          }

          // random placement
          // using 95 cause position is top left corner and i don't want
          // any of these good, good claps to be hidden 🤷‍♀️
          clapEl.style.left = Math.random() * 95 + "vw";
          clapEl.style.top = Math.random() * 95 + "vh";

          // add to DOM
          clapEl.appendChild(clapContent);
          clapZoneEl.appendChild(clapEl);

          playClapSound(socketId);

          // remove from DOM
          setTimeout(() => {
            clapEl.remove();
          }, CLAP_DURATION);

            // Calculate clap frequency
            clapTimestamps.push(new Date(clap.ts).getTime());
            // console.log(clapTimestamps);
        }

        function playClapSound(socketId) {
          const clapFiles = [
            "clap1.mp3",
            "clap2.mp3",
            "clap3.mp3",
            "clap4.mp3",
            "clap5.wav",
            "clap10.mp3",
            "clap11.mp3",
            "clap12.mp3",
            "clap13.mp3",
            "clap14.mp3",
            "clap15.mp3",
            "clap16.mp3",
            "clap17.mp3",
            "clap18.mp3",
            "clap19.mp3",
            "clap20.mp3",
            "clap21.mp3",
            "clap22.mp3",
          ];
          // const randomIndex = Math.floor(Math.random() * clapFiles.length);
          // const randomClapFile = clapFiles[randomIndex];

          index += 1;
          uniqueIndex = (index + socketId.charCodeAt(0)) % clapFiles.length;
          const randomClapFile = clapFiles[uniqueIndex];
          var audio = new Audio(randomClapFile);
          audio.play();
          audio.remove();
        }

        // respond to client count
        const clappersCountEl = document.getElementById("clappersCount");
        socket.on("clientsCount", count => {
          clappersCountEl.innerHTML = `${count} Clappers`;
        });
      };
    </script>
  </head>
  <body>
    <main>
      <div id="clapZone"></div>
      <div id="clapContainer">
        <div id="applauseGauge">
          <div id="gaugeBar"></div>
          <div id="gaugeLabels">
            <span>Slow Clap</span>
            <span>Light Applause</span>
            <span>Applause</span>
            <span>Standing Ovation</span>
            <span>Raucous</span>
            <span>DANK</span>
          </div>
        </div>
        <button id="clapButton">CLAP!</button>
      </div>
      <div id="clappersCount">0 Clappers</div>
    </main>
  </body>
</html>
